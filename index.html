function generateAvatarSvg(address) {
  const palettes = [
    ["#9945FF", "#14F195"], ["#FF5C6C", "#FFB86C"], ["#3DFF9A", "#00C2FF"],
    ["#FF61D8", "#7C4DFF"], ["#FFD23D", "#FF7A3D"], ["#38BDF8", "#818CF8"]
  ];
  let hash = 0;
  for (let i = 0; i < address.length; i++) hash = (hash * 31 + address.charCodeAt(i)) >>> 0;
  const [c1, c2] = palettes[hash % palettes.length];
  const shapeSeed = (hash >> 8) % 4;
  const shapes = [
    '<circle cx="16" cy="12" r="7"/><circle cx="10" cy="22" r="6"/><circle cx="24" cy="22" r="5"/>',
    '<rect x="4" y="4" width="12" height="12" rx="3"/><rect x="18" y="10" width="10" height="10" rx="3"/><rect x="8" y="20" width="14" height="8" rx="3"/>',
    '<polygon points="16,3 29,26 3,26"/>',
    '<circle cx="16" cy="16" r="13"/>'
  ];
  return '<svg viewBox="0 0 32 32" width="100%" height="100%"><defs><linearGradient id="av' + hash + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + c1 + '"/><stop offset="1" stop-color="' + c2 + '"/></linearGradient></defs><g fill="url(#av' + hash + ')">' + shapes[shapeSeed] + '</g></svg>';
}

function generateDisplayName(address) {
  const adjectives = ["Cosmic", "Solar", "Neon", "Rapid", "Silent", "Golden", "Lunar", "Turbo", "Crypto", "Astro"];
  const nouns = ["Whale", "Falcon", "Comet", "Nomad", "Ranger", "Phoenix", "Wolf", "Nova", "Rocket", "Voyager"];
  let hash = 0;
  for (let i = 0; i < address.length; i++) hash = (hash * 31 + address.charCodeAt(i)) >>> 0;
  const adj = adjectives[hash % adjectives.length];
  const noun = nouns[(hash >> 4) % nouns.length];
  return adj + " " + noun;
}

let cachedSolPrice = null;
let cachedSolPriceTime = 0;

async function fetchSolPriceUsd() {
  // Cache for 60s to avoid hammering the API on every token in a list.
  if (cachedSolPrice && (Date.now() - cachedSolPriceTime) < 60000) return cachedSolPrice;
  try {
    const res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=solana&vs_currencies=usd");
    const data = await res.json();
    const price = data?.solana?.usd;
    if (price) {
      cachedSolPrice = price;
      cachedSolPriceTime = Date.now();
      return price;
    }
  } catch (err) {
    console.error("CoinGecko price fetch failed:", err);
  }
  // Last-resort fallback so the UI never fully breaks even if both APIs fail.
  return cachedSolPrice || 150;
}

function restoreLocalWallet() {
  const saved = localStorage.getItem("deepfun_local_wallet");
  if (!saved) return false;
  try {
    const secretArray = JSON.parse(saved);
    localKeypair = Keypair.fromSecretKey(Uint8Array.from(secretArray));
    wallet = localKeypair.publicKey.toString();
    walletMode = "local";
    return true;
  } catch (err) {
    console.error("Failed to restore local wallet:", err);
    return false;
  }
}

function createLocalWallet() {
  const kp = Keypair.generate();
  localKeypair = kp;
  wallet = kp.publicKey.toString();
  walletMode = "local";
  localStorage.setItem("deepfun_local_wallet", JSON.stringify(Array.from(kp.secretKey)));
  return kp;
}

async function connectWallet() {
  if (!window.solana || !window.solana.isPhantom) {
    alert("Open this page inside Phantom's in-app browser, or install Phantom.");

    wallet = resp.publicKey.toString();
    walletMode = "phantom";
    showWalletGate = false;
    render();
  } catch (err) { console.error(err); }
}

async function signAndSend(tx, extraSigners = []) {
  tx.feePayer = new PublicKey(wallet);
  tx.recentBlockhash = (await connection.getLatestBlockhash()).blockhash;
  if (extraSigners.length) tx.partialSign(...extraSigners);

  if (walletMode === "local") {
    tx.sign(localKeypair, ...extraSigners);
    const sig = await connection.sendRawTransaction(tx.serialize());
    await connection.confirmTransaction(sig, "confirmed");
    return sig;
  }

  const signed = await window.solana.signTransaction(tx);
  const sig = await connection.sendRawTransaction(signed.serialize());
  await connection.confirmTransaction(sig, "confirmed");
  return sig;
}

// ---------- LAUNCH: mint + metadata + pool, metadata BEFORE authority revoke ----------
async function submitLaunch() {
  const name = document.getElementById("launch-name").value.trim();
  const symbol = document.getElementById("launch-symbol").value.trim();
  const statusEl = document.getElementById("launch-status");
  const btn = document.getElementById("launch-submit-btn");
  if (!wallet) return connectWallet();
  if (!name || !symbol) { statusEl.textContent = "Name and ticker are required."; return; }

  btn.disabled = true;
  try {
    const payer = new PublicKey(wallet);
    const mint = Keypair.generate();
    const positionNftMint = Keypair.generate();
    const totalSupplyWhole = 1000000000;
    const supplyRaw = BigInt(totalSupplyWhole) * BigInt(10 ** TOKEN_DECIMALS);

    // Upload image + real Metaplex-standard metadata JSON to IPFS via
    // Pinata, FIRST, before the on-chain transaction, so the metadata
    // instruction has a real URI. Routed through our own serverless
    // function — the Pinata JWT never touches the browser.
    let imageUrl = null;
    let metadataUri = "";
    if (uploadedImageFile) {
      statusEl.textContent = "Uploading image to IPFS...";
      try {
        const arrayBuffer = await uploadedImageFile.arrayBuffer();
        const imageBase64 = btoa(new Uint8Array(arrayBuffer).reduce((data, byte) => data + String.fromCharCode(byte), ""));

        const imgRes = await fetch("/api/upload-to-pinata", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ fileBase64: imageBase64, fileName: uploadedImageFile.name, contentType: uploadedImageFile.type }),
        });
        const imgData = await imgRes.json();
        if (!imgRes.ok) {
          console.error("Image upload failed:", imgData);
        } else {
          imageUrl = imgData.url; // dedicated gateway — used for our own app's image_uri
          const publicImageUrl = "https://ipfs.io/ipfs/" + imgData.cid; // universal gateway — used on-chain

          statusEl.textContent = "Uploading metadata to IPFS...";
          const metadataJson = JSON.stringify({ name, symbol, image: publicImageUrl, description: "" });
          const metadataBase64 = btoa(unescape(encodeURIComponent(metadataJson)));
          const jsonRes = await fetch("/api/upload-to-pinata", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ fileBase64: metadataBase64, fileName: mint.publicKey.toBase58() + ".json", contentType: "application/json" }),
          });
          const jsonData = await jsonRes.json();
          if (!jsonRes.ok) {
            console.error("Metadata JSON upload failed:", jsonData);
          } else {
            metadataUri = jsonData.url;
          }
        }
      } catch (uploadErr) {
        console.error("IPFS upload error:", uploadErr);
      }
    }

    statusEl.textContent = "Building transaction...";
    const lamports = await getMinimumBalanceForRentExemptMint(connection);
    const vaultAta = await getAssociatedTokenAddress(mint.publicKey, payer);

    const [metadataPda] = PublicKey.findProgramAddressSync(
      [Buffer.from("metadata"), METADATA_PROGRAM_ID.toBuffer(), mint.publicKey.toBuffer()],
      METADATA_PROGRAM_ID
    );
    const metadataIx = createCreateMetadataAccountV3Instruction(
      { metadata: metadataPda, mint: mint.publicKey, mintAuthority: payer, payer, updateAuthority: payer },
      {
        createMetadataAccountArgsV3: {
          data: { name, symbol, uri: metadataUri, sellerFeeBasisPoints: 0, creators: null, collection: null, uses: null },
          isMutable: true, collectionDetails: null,
        },
      }
    );

    // Metadata created BEFORE authority revoke — fixes earlier bug where
    // revoking authority first made metadata impossible to add afterward.
    const tokenInstructions = [
      SystemProgram.createAccount({
        fromPubkey: payer, newAccountPubkey: mint.publicKey,
        space: MINT_SIZE, lamports, programId: TOKEN_PROGRAM_ID,
      }),
      createInitializeMintInstruction(mint.publicKey, TOKEN_DECIMALS, payer, null),
      metadataIx,
      createAssociatedTokenAccountInstruction(payer, vaultAta, payer, mint.publicKey),
      createMintToInstruction(mint.publicKey, vaultAta, payer, supplyRaw),
      createSetAuthorityInstruction(mint.publicKey, payer, AuthorityType.MintTokens, null)
    ];

    const solPriceUsd = await fetchSolPriceUsd();
    const startingPriceSol = 5000 / totalSupplyWhole / solPriceUsd;
    const initSqrtPrice = getSqrtPriceFromPrice(String(startingPriceSol), TOKEN_DECIMALS, 9);
    const sqrtMinPrice = initSqrtPrice;
    const sqrtMaxPrice = getSqrtPriceFromPrice(String(startingPriceSol * 100000), TOKEN_DECIMALS, 9);

    const baseFee = getBaseFeeParams(
      { baseFeeMode: BaseFeeMode.FeeTimeSchedulerLinear,
        feeTimeSchedulerParam: { startingFeeBps: BASE_FEE_BPS, endingFeeBps: BASE_FEE_BPS, numberOfPeriod: 0, totalDuration: 0 } },
      9, ActivationType.Timestamp
    );

    const liquidityDelta = cpAmm.preparePoolCreationSingleSide({
      tokenAAmount: new BN(supplyRaw.toString()),
      minSqrtPrice: sqrtMinPrice, maxSqrtPrice: sqrtMaxPrice, initSqrtPrice,
      collectFeeMode: CollectFeeMode.OnlyB,
    });

    const created = await cpAmm.createCustomPool({
      payer, creator: payer, positionNft: positionNftMint.publicKey,
      tokenAMint: mint.publicKey, tokenBMint: NATIVE_MINT,
      tokenAAmount: new BN(supplyRaw.toString()), tokenBAmount: new BN(0),
      sqrtMinPrice, sqrtMaxPrice, liquidityDelta, initSqrtPrice,
      poolFees: { baseFee, compoundingFeeBps: 0, padding: 0, dynamicFee: null },
      hasAlphaVault: false, activationType: ActivationType.Timestamp,
      collectFeeMode: CollectFeeMode.OnlyB, activationPoint: null,
      tokenAProgram: TOKEN_PROGRAM_ID, tokenBProgram: TOKEN_PROGRAM_ID,
    });
    const poolTx = created.tx, pool = created.pool, position = created.position;

    const combinedTx = new Transaction().add(...tokenInstructions, ...poolTx.instructions);

    statusEl.textContent = "Approve in Phantom...";
    let sig;
    try {
      sig = await signAndSend(combinedTx, [mint, positionNftMint]);
    } catch (sizeErr) {
      const msg = String(sizeErr.message).toLowerCase();
      if (msg.includes("too large") || msg.includes("transaction too")) {
        statusEl.textContent = "Splitting into two steps...";
        await signAndSend(new Transaction().add(...tokenInstructions), [mint]);
        statusEl.textContent = "Step 2/2: approve pool creation...";
        sig = await signAndSend(poolTx, [positionNftMint]);
      } else { throw sizeErr; }
    }

    statusEl.textContent = "Saving to registry...";
    const { error } = await supabase.from("Deepfun1").insert({
      mint: mint.publicKey.toBase58(), pool: pool.toBase58(),
      position_address: position.toBase58(), position_nft_mint: positionNftMint.publicKey.toBase58(),
      name, symbol, network: NETWORK, image_uri: imageUrl, creator: wallet,
    });
    if (error) console.error("Registry insert failed:", error);

    statusEl.textContent = "Launched! " + name + " (" + symbol + ") is live.";
    setTimeout(() => { currentPage = "home"; render(); }, 1500);
  } catch (err) {
    console.error(err);
    statusEl.textContent = "Error: " + err.message;
    btn.disabled = false;
  }
}

// ---------- BUY/SELL ----------
async function getQuoteForAmount(amountVal) {
  const pool = new PublicKey(activeToken.pool);
  const poolState = await cpAmm.fetchPoolState(pool);
  const slot = await connection.getSlot();
  const blockTime = await connection.getBlockTime(slot);
  const inputMint = tradeMode === "buy" ? NATIVE_MINT : new PublicKey(activeToken.mint);
  const amountIn = tradeMode === "buy" ? new BN(Math.floor(amountVal * 1e9)) : new BN(Math.floor(amountVal * (10 ** TOKEN_DECIMALS)));
  return cpAmm.getQuote({
    inAmount: amountIn, inputTokenMint: inputMint, slippage: 5, poolState,
    currentTime: blockTime || Math.floor(Date.now() / 1000), currentSlot: slot,
    tokenADecimal: TOKEN_DECIMALS, tokenBDecimal: 9,
  });
}

async function executeTrade() {
  const amountInput = document.getElementById("trade-amount");
  const statusEl = document.getElementById("trade-status");
  const amount = parseFloat(amountInput.value);
  if (!wallet) return connectWallet();
  if (!amount || amount <= 0) { statusEl.textContent = "Enter an amount."; return; }
  try {
    statusEl.textContent = "Building quote...";
    const quote = await getQuoteForAmount(amount);
    const pool = new PublicKey(activeToken.pool);
    const poolState = await cpAmm.fetchPoolState(pool);
    const tokenAMint = new PublicKey(activeToken.mint);
    const inputMint = tradeMode === "buy" ? NATIVE_MINT : tokenAMint;
    const outputMint = tradeMode === "buy" ? tokenAMint : NATIVE_MINT;
    const amountIn = tradeMode === "buy" ? new BN(Math.floor(amount * 1e9)) : new BN(Math.floor(amount * (10 ** TOKEN_DECIMALS)));
    const tx = await cpAmm.swap({
      payer: new PublicKey(wallet), pool, inputTokenMint: inputMint, outputTokenMint: outputMint,
      amountIn, minimumAmountOut: quote.minSwapOutAmount, tokenAMint, tokenBMint: NATIVE_MINT,
      tokenAVault: poolState.tokenAVault, tokenBVault: poolState.tokenBVault,
      tokenAProgram: TOKEN_PROGRAM_ID, tokenBProgram: TOKEN_PROGRAM_ID, referralTokenAccount: null,
    });
    statusEl.textContent = "Approve in Phantom...";
    const sig = await signAndSend(tx);
    statusEl.textContent = "Done! " + sig.slice(0, 12) + "...";
  } catch (err) {
    console.error(err);
    statusEl.textContent = "Error: " + err.message;
  }
}

async function loadWalletData() {
  const owner = new PublicKey(wallet);
  const balanceLamports = await connection.getBalance(owner);
  document.getElementById("wallet-balance").textContent = (balanceLamports / 1e9).toFixed(4) + " SOL";

  const tokenAccounts = await connection.getParsedTokenAccountsByOwner(owner, { programId: TOKEN_PROGRAM_ID });
  const launches = await fetchLaunches();
  const holdingsEl = document.getElementById("wallet-holdings");
  const holdings = tokenAccounts.value
    .map((t) => t.account.data.parsed.info)
    .filter((info) => Number(info.tokenAmount.uiAmount) > 0);

  if (!holdings.length) {
    holdingsEl.innerHTML = '<div class="empty-state">No token holdings yet.</div>';
    return;
  }
  holdingsEl.innerHTML = holdings.map((h) => {
    const known = launches.find((l) => l.mint === h.mint);
    const label = known ? known.symbol : (h.mint.slice(0, 4) + "..." + h.mint.slice(-4));
    return '<div class="holding-row"><div class="token-sub">' + label + '</div><div>' + Number(h.tokenAmount.uiAmount).toLocaleString() + '</div></div>';
  }).join("");
}

async function renderHome() {

  cachedHomeLaunches = launches;

  if (homeFilter === "new") launches = [...launches].reverse();
  // "trending" sorts by live liquidity once stats have loaded (see loadHomeStats);
  // on first paint before stats exist it falls back to default order.
  if (homeFilter === "trending" && Object.keys(homeTokenStats).length) {
    launches = [...launches].sort((a, b) => (homeTokenStats[b.mint]?.liquidityUsd || 0) - (homeTokenStats[a.mint]?.liquidityUsd || 0));
  }

  function tokenAge(l) {
    if (!l.created_at) return "";
    const ms = Date.now() - new Date(l.created_at).getTime();
    const mins = Math.floor(ms / 60000);
    if (mins < 60) return mins + "m";
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + "h";
    return Math.floor(hrs / 24) + "d";
  }

  const tickerHtml = launches.slice(0, 12).map((l) => {
    const stat = homeTokenStats[l.mint];

      ? '<span class="ticker-change ' + (change >= 0 ? "up" : "down") + '">' + (change >= 0 ? "+" : "") + change.toFixed(1) + '%</span>'

            '<div class="trench-stat"><div class="trench-stat-label">MC</div><div class="trench-stat-value">$' + stat.mcUsd.toLocaleString(undefined, {maximumFractionDigits:0}) + '</div></div>' +

          : '<div class="trench-stats-row" id="stat-' + l.mint + '"><div class="trench-stat"><div class="trench-stat-value token-sub">Loading...</div></div></div>';
        return '<div class="trench-card" data-mint="' + l.mint + '">' +
          '<div class="trench-thumb">' + (l.image_uri ? '<img src="' + l.image_uri + '" />' : (l.symbol ? l.symbol[0] : "?")) + '</div>' +
          '<div class="trench-body">' +
          '<div class="trench-top-row"><span class="trench-symbol">' + l.symbol + '</span><span class="v2-badge">V2</span></div>' +
          '<div class="trench-name">' + l.name + '</div>' +

function formatTimeAgo(blockTime) {
  if (!blockTime) return "";
  const seconds = Math.max(1, Math.floor(Date.now() / 1000 - blockTime));
  if (seconds < 3600) return Math.floor(seconds / 60) + "m ago";
  if (seconds < 86400) return Math.floor(seconds / 3600) + "h ago";
  return Math.floor(seconds / 86400) + "d ago";
}

async function loadRecentTrades() {
  if (!activeToken) return;
  const tradesCard = document.getElementById("trades-card");
  try {
    const pool = new PublicKey(activeToken.pool);
    const tokenMint = activeToken.mint;
    const signatures = await connection.getSignaturesForAddress(pool, { limit: 20 });
    const rows = [];

    const solPriceUsd = await fetchSolPriceUsd();

    for (const sigInfo of signatures) {
      const tx = await connection.getParsedTransaction(sigInfo.signature, { maxSupportedTransactionVersion: 0 });
      if (!tx || !tx.meta) continue;
      const logs = tx.meta.logMessages || [];
      const isSwap = logs.some((l) => l.toLowerCase().includes("swap"));
      if (!isSwap) continue;

      const trader = tx.transaction.message.accountKeys[0].pubkey.toBase58();
      const preSol = tx.meta.preBalances[0];
      const postSol = tx.meta.postBalances[0];
      const solDelta = (postSol - preSol) / 1e9;
      const type = solDelta < 0 ? "Buy" : "Sell";

      // Real token amount actually traded, from this trader's token balance change
      let tokenAmount = 0;
      const preTok = (tx.meta.preTokenBalances || []).find((b) => b.owner === trader && b.mint === tokenMint);
      const postTok = (tx.meta.postTokenBalances || []).find((b) => b.owner === trader && b.mint === tokenMint);
      const preAmt = preTok ? Number(preTok.uiTokenAmount.uiAmount || 0) : 0;
      const postAmt = postTok ? Number(postTok.uiTokenAmount.uiAmount || 0) : 0;
      tokenAmount = Math.abs(postAmt - preAmt);

      const usdValue = Math.abs(solDelta) * solPriceUsd;
      const priceUsdAtTrade = tokenAmount > 0 ? usdValue / tokenAmount : null;
      const timeAgo = formatTimeAgo(sigInfo.blockTime);

      rows.push({ trader, type, tokenAmount, usdValue, timeAgo, priceUsdAtTrade, blockTime: sigInfo.blockTime });
      if (rows.length >= 12) break;
    }

    tradesCard.innerHTML = rows.length
      ? rows.map((r) =>
          '<div class="trade-row"><div class="trade-left">' +
          '<span class="trade-type ' + (r.type === "Buy" ? "stat-positive" : "stat-negative") + '">' + r.type + '</span>' +
          '<span class="token-sub">' + r.trader.slice(0, 4) + '..' + r.trader.slice(-4) + '</span>' +
          '<span>' + r.tokenAmount.toLocaleString(undefined, {maximumFractionDigits:0}) + ' ' + activeToken.symbol + '</span>' +
          '</div><div style="text-align:right;">' +
          '<div>$' + r.usdValue.toFixed(2) + '</div>' +
          '<div class="token-sub">' + r.timeAgo + '</div></div></div>'
        ).join("")
      : '<div class="empty-state">No trades yet.</div>';
  } catch (err) {
    console.error("Failed to load trades:", err);
    tradesCard.innerHTML = '<div class="empty-state">Trades unavailable.</div>';
  }
}

async function loadTokenStats() {

    const pool = new PublicKey(activeToken.pool);

    const priceInSol = getPriceFromSqrtPrice(poolState.sqrtPrice, TOKEN_DECIMALS, 9);
    const priceUsd = Number(priceInSol) * solPriceUsd;
    const totalSupply = 1000000000;
    const marketCapUsd = priceUsd * totalSupply;
    currentTokenMc = marketCapUsd;

    const pooledToken = Number(poolState.tokenAAmount) / (10 ** TOKEN_DECIMALS);
    const pooledSol = Number(poolState.tokenBAmount) / 1e9;
    const liquidityUsd = (pooledToken * priceUsd) + (pooledSol * solPriceUsd);

    // Real holder count: every token account for this mint with a nonzero balance

    try {

        filters: [

    if (refreshBtn) {
      refreshBtn.addEventListener("click", () => {

        refreshBtn.style.transform = "rotate(360deg)";
        loadProfileData();
        setTimeout(() => { refreshBtn.style.transform = "rotate(0deg)"; }, 400);

  const nameDisplay = document.getElementById("profile-name-display");

      if (newName === null) return;

      if (!trimmed) return;
      nameDisplay.textContent = trimmed;
      try {
        await supabase.from("profiles").upsert({ wallet, display_name: trimmed, updated_at: new Date().toISOString() });
        profileDisplayNames[wallet] = trimmed;
      } catch (err) {
        console.error("Failed to save display name:", err);
      }
    });
  }

  try {
    const { data: profileRow } = await supabase.from("profiles").select("display_name").eq("wallet", targetWallet).maybeSingle();
    if (profileRow && profileRow.display_name) {
      profileDisplayNames[targetWallet] = profileRow.display_name;
      const nameEl = document.getElementById("profile-name-display");
      if (nameEl) nameEl.textContent = profileRow.display_name;
    }
  } catch (err) {
    console.error("Failed to load saved display name:", err);
  }

  const copyBtn = document.getElementById("profile-copy-btn");
  if (copyBtn) {
    copyBtn.addEventListener("click", () => {
      navigator.clipboard.writeText(targetWallet);
      const original = copyBtn.innerHTML;

      setTimeout(() => { copyBtn.innerHTML = original; }, 1500);
    });
  }

  const launches = await fetchLaunches();
  let solBalance = 0;
  let solPriceUsd = 0;

  if (isOwnProfile) {

      connection.getBalance(new PublicKey(targetWallet)),
      fetchSolPriceUsd(),

    solBalance = balanceLamports / 1e9;
    solPriceUsd = price;

  const solUsdValue = solBalance * solPriceUsd;
  const solValueEl = document.getElementById("portfolio-sol-value");
  if (solValueEl) solValueEl.textContent = "$" + solUsdValue.toLocaleString(undefined, { maximumFractionDigits: 2 });

  let totalTokenUsdValue = 0;
  let allocationEntries = [];
  const holdingsEl = document.getElementById("profile-holdings");
  if (holdingsEl) {
    try {
      const tokenAccounts = await connection.getParsedTokenAccountsByOwner(new PublicKey(wallet), { programId: TOKEN_PROGRAM_ID });
      const rows = [
        '<div class="token-row"><div class="token-thumb">' + SOL_LOGO_SVG + '</div>' +
        '<div class="token-card-body"><div class="token-card-title-row"><span class="token-card-name">Solana</span><span class="token-symbol-badge">SOL</span></div>' +
        '<div class="token-card-stats"><div class="stat-block"><div class="stat-label">Balance</div><div class="stat-value">' + solBalance.toFixed(4) + '</div></div>' +
        '<div class="stat-block"><div class="stat-label">Value</div><div class="stat-value">$' + (solBalance * solPriceUsd).toLocaleString(undefined, { maximumFractionDigits: 2 }) + '</div></div></div></div></div>'
      ];

      for (const acc of tokenAccounts.value) {
        const info = acc.account.data.parsed.info;
        const amount = info.tokenAmount.uiAmount;
        if (!amount || amount <= 0) continue;
        const mint = info.mint;
        const registryEntry = launches.find((l) => l.mint === mint);
        if (registryEntry && registryEntry.symbol === "DFNTEST") continue;
        const name = registryEntry ? registryEntry.name : shortAddr(mint);
        const symbol = registryEntry ? registryEntry.symbol : "";
        const thumbHtml = registryEntry && registryEntry.image_uri
          ? '<img src="' + registryEntry.image_uri + '" />'
          : (symbol ? symbol[0] : "?");
        let valueHtml = '';
        if (registryEntry && registryEntry.pool) {
          try {
            const mc = await getLiveMc(mint, registryEntry.pool);
            const pricePerToken = mc / 1000000000;
            const usdValue = amount * pricePerToken;
            totalTokenUsdValue += usdValue;
            allocationEntries.push({ symbol, value: usdValue });
            valueHtml = '<div class="stat-block"><div class="stat-label">Value</div><div class="stat-value">$' + usdValue.toLocaleString(undefined, { maximumFractionDigits: 2 }) + '</div></div>';
          } catch (err) {
            console.error("Failed to fetch live value for", symbol, err);
          }
        }
        rows.push(
          '<div class="token-row"' + (registryEntry ? ' data-mint="' + mint + '"' : '') + '>' +
          '<div class="token-thumb">' + thumbHtml + '</div>' +
          '<div class="token-card-body"><div class="token-card-title-row"><span class="token-card-name">' + name + '</span><span class="token-symbol-badge">' + symbol + '</span></div>' +
          '<div class="token-card-stats"><div class="stat-block"><div class="stat-label">Balance</div><div class="stat-value">' + amount.toLocaleString(undefined, { maximumFractionDigits: 2 }) + '</div></div>' + valueHtml + '</div></div></div>'
        );
      }
      if (profilePortfolioTab === "assets" || !profilePortfolioTab) holdingsEl.innerHTML = rows.join("");
      holdingsEl.querySelectorAll(".token-row[data-mint]").forEach((row) => {
        row.addEventListener("click", () => {
          const mint = row.getAttribute("data-mint");
          const launch = launches.find((l) => l.mint === mint);
          if (launch) { activeToken = launch; currentPage = "detail"; render(); }
        });
      });

      const tokenValueEl = document.getElementById("portfolio-token-value");
      if (tokenValueEl) tokenValueEl.textContent = "$" + totalTokenUsdValue.toLocaleString(undefined, { maximumFractionDigits: 2 });

      const netWorthEl = document.getElementById("portfolio-networth");
      if (netWorthEl) netWorthEl.textContent = "$" + (solUsdValue + totalTokenUsdValue).toLocaleString(undefined, { maximumFractionDigits: 2 });

      const allocationBar = document.getElementById("portfolio-allocation-bar");
      const allocationLegend = document.getElementById("portfolio-allocation-legend");
      if (allocationBar && allocationLegend) {
        const allColors = ["#3DFF9A", "#9945FF", "#FF61D8", "#38BDF8", "#FFD23D", "#FF7A3D"];
        const allEntries = [{ symbol: "SOL", value: solUsdValue }, ...allocationEntries];
        const total = allEntries.reduce((sum, e) => sum + e.value, 0);
        if (total > 0) {
          allocationBar.innerHTML = allEntries.map((e, i) =>
            '<div style="width:' + ((e.value / total) * 100).toFixed(1) + '%;background:' + allColors[i % allColors.length] + ';"></div>'
          ).join("");
          allocationLegend.innerHTML = allEntries.map((e, i) =>
            '<div class="allocation-legend-item"><div class="allocation-dot" style="background:' + allColors[i % allColors.length] + ';"></div>' + e.symbol + ' ' + ((e.value / total) * 100).toFixed(0) + '%</div>'
          ).join("");
        } else {
          allocationBar.innerHTML = '<div style="width:100%;background:var(--card-border);"></div>';
          allocationLegend.innerHTML = '<span class="token-sub">No assets yet.</span>';
        }
      }
    } catch (err) {
      console.error("Failed to load token holdings:", err);
      if (holdingsEl) holdingsEl.innerHTML = '<div class="card empty-state">Couldn\'t load holdings.</div>';
    }
  }

  const txHistoryEl = document.getElementById("profile-tx-history");
  if (txHistoryEl && profilePortfolioTab === "history") {
    try {
      const sigs = await connection.getSignaturesForAddress(new PublicKey(wallet), { limit: 15 });
      txHistoryEl.innerHTML = sigs.length
        ? sigs.map((s) =>
            '<div class="tx-row"><span class="tx-sig">' + s.signature.slice(0, 8) + '...' + s.signature.slice(-6) + '</span>' +
            '<span class="tx-time">' + (s.blockTime ? new Date(s.blockTime * 1000).toLocaleDateString() : "—") + '</span></div>'
          ).join("")
        : '<div class="empty-state">No transactions yet.</div>';
    } catch (err) {
      console.error("Failed to load transaction history:", err);
      txHistoryEl.innerHTML = '<div class="empty-state">Couldn\'t load history.</div>';
    }
  }

  } // end isOwnProfile

  const mine = launches.filter((l) => l.creator === targetWallet);
  const countEl = document.getElementById("profile-launch-count");
  if (countEl) countEl.textContent = mine.length;
  if (el) {
    el.innerHTML = mine.length
      ? mine.map((l) => {
          const stat = homeTokenStats[l.mint];
          const statsRow = stat
            ? '<div class="token-card-stats">' +
              '<div class="stat-block"><div class="stat-label">TXNs</div><div class="stat-value">' + (stat.txnCount ?? "...") + '</div></div>' +
              '<div class="stat-block"><div class="stat-label">MC</div><div class="stat-value">$' + stat.mcUsd.toLocaleString(undefined, {maximumFractionDigits:0}) + '</div></div>' +
              '<div class="stat-block"><div class="stat-label">Liquidity</div><div class="stat-value">$' + stat.liquidityUsd.toLocaleString(undefined, {maximumFractionDigits:0}) + '</div></div>' +
              '</div>'
            : '<div class="token-card-stats" id="stat-' + l.mint + '"><div class="stat-block"><div class="stat-value token-sub">Loading...</div></div></div>';
          return '<div class="token-row" data-mint="' + l.mint + '">' +
            '<div class="token-thumb">' + (l.image_uri ? '<img src="' + l.image_uri + '" />' : (l.symbol ? l.symbol[0] : "?")) + '</div>' +
            '<div class="token-card-body">' +
            '<div class="token-card-title-row"><span class="token-card-name">' + l.name + '</span><span class="token-symbol-badge">' + l.symbol + '</span></div>' +
            statsRow +
            '</div></div>';
        }).join("")
      : '<div class="card empty-state">No launches yet from this wallet.</div>';
    el.querySelectorAll(".token-row[data-mint]").forEach((row) => {
      row.addEventListener("click", () => {
        const mint = row.getAttribute("data-mint");
        const launch = mine.find((l) => l.mint === mint);
        if (launch) { activeToken = launch; currentPage = "detail"; render(); }
      });
    });
    for (const l of mine) {
      if (homeTokenStats[l.mint]) continue;
      try {
        const pool = new PublicKey(l.pool);
        const poolState = await cpAmm.fetchPoolState(pool);
        const solPriceUsd = await fetchSolPriceUsd();
        const priceInSol = getPriceFromSqrtPrice(poolState.sqrtPrice, TOKEN_DECIMALS, 9);
        const priceUsd = Number(priceInSol) * solPriceUsd;
        const mcUsd = priceUsd * 1000000000;
        const pooledToken = Number(poolState.tokenAAmount) / (10 ** TOKEN_DECIMALS);
        const pooledSol = Number(poolState.tokenBAmount) / 1e9;
        const liquidityUsd = (pooledToken * priceUsd) + (pooledSol * solPriceUsd);
        let txnCount = "0";
        try {
          const sigs = await connection.getSignaturesForAddress(pool, { limit: 50 });
          txnCount = sigs.length >= 50 ? "50+" : String(sigs.length);
        } catch (e) {}
        homeTokenStats[l.mint] = { mcUsd, liquidityUsd, txnCount };
        const statEl = document.getElementById("stat-" + l.mint);
        if (statEl) {
          statEl.innerHTML = '<div class="stat-block"><div class="stat-label">TXNs</div><div class="stat-value">' + txnCount + '</div></div>' +
            '<div class="stat-block"><div class="stat-label">MC</div><div class="stat-value">$' + mcUsd.toLocaleString(undefined, {maximumFractionDigits:0}) + '</div></div>' +
            '<div class="stat-block"><div class="stat-label">Liquidity</div><div class="stat-value">$' + liquidityUsd.toLocaleString(undefined, {maximumFractionDigits:0}) + '</div></div>';
        }
      } catch (err) {
        console.error("Failed to load stats for launch", l.mint, err);
      }
    }
  }

  const { data: calls, error: callsErr } = await supabase.from("calls").select("*").eq("caller", targetWallet);
  const callCountEl = document.getElementById("profile-call-count");
  const highestCallEl = document.getElementById("profile-highest-call");
  const callsEl = document.getElementById("profile-calls");

  if (callsErr || !calls || !calls.length) {
    if (callCountEl) callCountEl.textContent = "0";
    if (highestCallEl) highestCallEl.textContent = "—";
    if (callsEl) callsEl.innerHTML = '<div class="empty-state">No calls made yet.</div>';
    return;
  }

  if (callCountEl) callCountEl.textContent = calls.length;

  const callRows = [];
  let highestX = 0;
  for (const c of calls) {
    const launch = launches.find((l) => l.mint === c.mint);
    if (!launch) continue;
    try {
      const liveMc = await getLiveMc(c.mint, launch.pool);
      const multiplier = liveMc / Number(c.mc_at_call);
      if (multiplier > highestX) highestX = multiplier;
      callRows.push({ name: launch.name, symbol: launch.symbol, multiplier });
    } catch (err) {
      console.error("Failed to load live MC for call:", err);
    }
  }

  if (highestCallEl) highestCallEl.textContent = highestX > 0 ? highestX.toFixed(2) + "x" : "—";

  if (callsEl) {
    callsEl.innerHTML = callRows.length
      ? callRows.map((r) =>
          '<div class="holding-row"><div class="token-sub">' + r.name + ' (' + r.symbol + ')</div>' +
          '<div class="' + (r.multiplier >= 1 ? "stat-positive" : "stat-negative") + '" style="font-weight:700;">' + r.multiplier.toFixed(2) + 'x</div></div>'
        ).join("")
      : '<div class="empty-state">No calls made yet.</div>';
  }
}

function renderFeed() {
  return '<h1>Feed</h1><div class="page-subtitle">Live calls from across Deepfun</div>' +
    '<div class="token-list" id="feed-list"><div class="card empty-state">Loading feed...</div></div>';
}

async function loadFeedData() {
  const el = document.getElementById("feed-list");
  if (!el) return;

  const [{ data: calls, error }, launches] = await Promise.all([
    supabase.from("calls").select("*").eq("network", NETWORK).order("created_at", { ascending: false }).limit(30),
    fetchLaunches(),
  ]);

  if (error || !calls || !calls.length) {
    el.innerHTML = '<div class="card empty-state">No calls yet. Be the first to call a token.</div>';
    return;
  }

  feedCalls = calls;
  const callIds = calls.map((c) => c.id);

  const [{ data: likes }, { data: comments }, { data: reposts }] = await Promise.all([
    supabase.from("likes").select("*").in("call_id", callIds),
    supabase.from("comments").select("*").in("call_id", callIds).order("created_at", { ascending: true }),
    supabase.from("reposts").select("*").in("call_id", callIds),
  ]);

  const rows = [];
  for (const c of calls) {
    const launch = launches.find((l) => l.mint === c.mint);
    if (!launch) continue;
    let multiplierHtml = '<span class="token-sub">Loading...</span>';
    try {
      const liveMc = await getLiveMc(c.mint, launch.pool);
      const multiplier = liveMc / Number(c.mc_at_call);
      multiplierHtml = '<span class="feed-multiplier ' + (multiplier >= 1 ? "stat-positive" : "stat-negative") + '">' + multiplier.toFixed(2) + 'x</span>';
    } catch (err) {
      console.error("Failed to load live MC for feed call:", err);
    }

    const callLikes = (likes || []).filter((l) => l.call_id === c.id);
    const callComments = (comments || []).filter((cm) => cm.call_id === c.id);
    const callReposts = (reposts || []).filter((r) => r.call_id === c.id);
    const iLiked = wallet && callLikes.some((l) => l.wallet === wallet);
    const iReposted = wallet && callReposts.some((r) => r.reposter === wallet);

    const commentsHtml = callComments.map((cm) =>
      '<div class="comment-row"><span class="comment-author">' + shortAddr(cm.commenter) + '</span>' + escapeHtml(cm.body) + '</div>'
    ).join("");

    const callerName = generateDisplayName(c.caller);
    const callerAvatar = generateAvatarSvg(c.caller);
    rows.push(
      '<div class="feed-card" data-call-id="' + c.id + '" data-call-mint="' + c.mint + '" data-call-pool="' + launch.pool + '">' +
      '<div class="post-header">' +
      '<div class="post-avatar post-avatar-clickable" data-caller="' + c.caller + '">' + callerAvatar + '</div>' +
      '<div style="flex:1;min-width:0;cursor:pointer;" class="post-caller-clickable" data-caller="' + c.caller + '">' +
      '<div class="post-caller-name">' + callerName + '</div>' +
      '<div class="post-caller-addr">' + shortAddr(c.caller) + '</div>' +
      '</div>' + multiplierHtml +
      '</div>' +
      '<div class="post-token-row">' +
      '<div class="token-thumb">' + (launch.image_uri ? '<img src="' + launch.image_uri + '" />' : (launch.symbol ? launch.symbol[0] : "?")) + '</div>' +
      '<span class="token-card-name">' + launch.name + '</span><span class="token-symbol-badge">' + launch.symbol + '</span>' +
      '</div>' +
      (c.caption ? '<div class="post-caption">' + escapeHtml(c.caption) + '</div>' : '') +
      '<div class="post-action-row">' +
      '<button class="post-action-btn like-btn ' + (iLiked ? "liked" : "") + '" data-call-id="' + c.id + '">♥ ' + callLikes.length + '</button>' +
      '<button class="post-action-btn comment-toggle-btn" data-call-id="' + c.id + '">💬 ' + callComments.length + '</button>' +

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

let feedListWired = false;
function wireFeedList() {
  const list = document.getElementById("feed-list");
  if (!list || feedListWired) { if (list) attachFeedListener(list); return; }
  feedListWired = true;
  attachFeedListener(list);
}

function attachFeedListener(list) {
  list.onclick = async (e) => {
    const callerEl = e.target.closest(".post-caller-clickable") || e.target.closest(".post-avatar-clickable");
    if (callerEl) {
      viewingWallet = callerEl.getAttribute("data-caller");
      currentPage = "profile";
      render();
      return;
    }

    const likeBtn = e.target.closest(".like-btn");
    if (likeBtn) return handleLike(likeBtn);

    const commentToggle = e.target.closest(".comment-toggle-btn");
    if (commentToggle) {
      const section = list.querySelector('[data-comment-section="' + commentToggle.getAttribute("data-call-id") + '"]');
      if (section) section.style.display = section.style.display === "none" ? "block" : "none";
      return;
    }

    const commentSend = e.target.closest("[data-comment-send]");
    if (commentSend) return handleComment(commentSend, list);

    const repostBtn = e.target.closest(".repost-btn");
    if (repostBtn) return handleRepost(repostBtn);

    const buyToggle = e.target.closest(".buy-toggle-btn");
    if (buyToggle) {
      const panel = list.querySelector('[data-buy-panel="' + buyToggle.getAttribute("data-call-id") + '"]');
      if (panel) panel.style.display = panel.style.display === "none" ? "block" : "none";
      return;
    }

    const presetBtn = e.target.closest(".feed-preset-btn");
    if (presetBtn) {
      const panel = presetBtn.closest(".feed-buy-panel");
      const callId = panel.getAttribute("data-buy-panel");
      const input = panel.querySelector('[data-amount-input="' + callId + '"]');
      input.value = presetBtn.getAttribute("data-preset");
      panel.querySelectorAll(".feed-preset-btn").forEach((b) => b.classList.remove("active"));
      presetBtn.classList.add("active");
      return;
    }

    const confirmBtn = e.target.closest("[data-confirm-id]");
    if (confirmBtn) return handleFeedBuy(confirmBtn, list);
  };
}

async function handleLike(btn) {
  if (!wallet) { connectWallet(); return; }
  const callId = btn.getAttribute("data-call-id");
  const liked = btn.classList.contains("liked");
  btn.disabled = true;
  try {
    if (liked) {
      await supabase.from("likes").delete().eq("call_id", callId).eq("wallet", wallet);
    } else {
      await supabase.from("likes").insert({ call_id: callId, wallet });
    }
    const count = liked ? -1 : 1;
    const current = parseInt(btn.textContent.replace("♥ ", "")) || 0;
    btn.textContent = "♥ " + Math.max(0, current + count);
    btn.classList.toggle("liked");
  } catch (err) {
    console.error("Like failed:", err);
  }
  btn.disabled = false;
}

async function handleRepost(btn) {
  if (!wallet) { connectWallet(); return; }
  const callId = btn.getAttribute("data-call-id");
  const reposted = btn.classList.contains("reposted");
  if (reposted) return;
  btn.disabled = true;
  try {
    const { error } = await supabase.from("reposts").insert({ call_id: callId, reposter: wallet });
    if (!error) {
      const current = parseInt(btn.textContent.replace("🔁 ", "")) || 0;
      btn.textContent = "🔁 " + (current + 1);
      btn.classList.add("reposted");
    }
  } catch (err) {
    console.error("Repost failed:", err);
  }
  btn.disabled = false;
}

async function handleComment(btn, list) {
  if (!wallet) { connectWallet(); return; }
  const callId = btn.getAttribute("data-comment-send");
  const input = list.querySelector('[data-comment-input="' + callId + '"]');
  const body = input.value.trim();
  if (!body) return;
  btn.disabled = true;
  try {
    const { error } = await supabase.from("comments").insert({ call_id: callId, commenter: wallet, body });
    if (!error) {
      const commentList = list.querySelector('[data-comment-list="' + callId + '"]');
      commentList.innerHTML += '<div class="comment-row"><span class="comment-author">' + shortAddr(wallet) + '</span>' + escapeHtml(body) + '</div>';
      input.value = "";
      const toggleBtn = list.querySelector('.comment-toggle-btn[data-call-id="' + callId + '"]');
      const current = parseInt(toggleBtn.textContent.replace("💬 ", "")) || 0;
      toggleBtn.textContent = "💬 " + (current + 1);
    }
  } catch (err) {
    console.error("Comment failed:", err);
  }
  btn.disabled = false;
}

async function handleFeedBuy(btn, list) {
  const callId = btn.getAttribute("data-confirm-id");
  const panel = btn.closest(".feed-buy-panel");
  const card = btn.closest(".feed-card");
  const mint = card.getAttribute("data-call-mint");
  const pool = card.getAttribute("data-call-pool");
  const input = panel.querySelector('[data-amount-input="' + callId + '"]');
  const statusEl = panel.querySelector('[data-status-id="' + callId + '"]');
  const amount = parseFloat(input.value);
  if (!wallet) { connectWallet(); return; }
  if (!amount || amount <= 0) { statusEl.textContent = "Enter an amount."; return; }
  btn.disabled = true;
  statusEl.textContent = "Building quote...";
  try {
    await executeFeedTrade(mint, pool, amount, statusEl);
  } catch (err) {
    console.error(err);
    statusEl.textContent = "Error: " + err.message;
  }
  btn.disabled = false;
}

async function executeFeedTrade(mint, poolAddr, amountSol, statusEl) {
  const pool = new PublicKey(poolAddr);
  const poolState = await cpAmm.fetchPoolState(pool);
  const slot = await connection.getSlot();
  const blockTime = await connection.getBlockTime(slot);
  const tokenAMint = new PublicKey(mint);
  const amountIn = new BN(Math.floor(amountSol * 1e9));
  const quote = await cpAmm.getQuote({
    inAmount: amountIn, inputTokenMint: NATIVE_MINT, slippage: 5, poolState,
    currentTime: blockTime || Math.floor(Date.now() / 1000), currentSlot: slot,
    tokenADecimal: TOKEN_DECIMALS, tokenBDecimal: 9,
  });
  const tx = await cpAmm.swap({
    payer: new PublicKey(wallet), pool, inputTokenMint: NATIVE_MINT, outputTokenMint: tokenAMint,
    amountIn, minimumAmountOut: quote.minSwapOutAmount, tokenAMint, tokenBMint: NATIVE_MINT,
    tokenAVault: poolState.tokenAVault, tokenBVault: poolState.tokenBVault,
    tokenAProgram: TOKEN_PROGRAM_ID, tokenBProgram: TOKEN_PROGRAM_ID, referralTokenAccount: null,
  });
  statusEl.textContent = "Approve in Phantom...";
  const sig = await signAndSend(tx);
  statusEl.textContent = "Done! " + sig.slice(0, 12) + "...";
}

function renderWalletGate() {
  return '<div style="min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;">' +
    '<div style="text-align:center;margin-bottom:32px;">' +
    '<div class="brand-mark" style="width:64px;height:64px;border-radius:18px;margin:0 auto 16px;font-size:28px;">' + LOGO_SVG + '</div>' +
    '<div style="font-size:26px;font-weight:800;">Deepfun</div>' +
    '<div class="page-subtitle">Launch and trade tokens on Solana</div>' +
    '</div>' +
    '<button class="btn btn-primary btn-block" id="gate-create-btn" style="margin-bottom:12px;">Create Wallet</button>' +
    '<button class="btn btn-secondary btn-block" id="gate-connect-btn" style="margin-bottom:20px;">Connect Phantom</button>' +
    '<div style="text-align:center;"><button id="gate-skip-btn" style="background:none;border:none;color:var(--text-dim);font-size:13px;text-decoration:underline;">Continue without a wallet</button></div>' +
    '</div>';
}

function renderWalletBackup(kp) {
  const secretBase58 = bs58Encode(kp.secretKey);
  return '<div style="min-height:100vh;padding:24px;">' +
    '<h1 style="font-size:20px;">Save your wallet</h1>' +
    '<div class="card" style="border-color:var(--danger);">' +
    '<div class="token-sub" style="margin-bottom:8px;">Your address</div>' +
    '<div style="font-size:12px;word-break:break-all;margin-bottom:16px;">' + kp.publicKey.toString() + '</div>' +
    '<div class="token-sub" style="margin-bottom:8px;color:var(--danger);">Private key — save this now, it will not be shown again</div>' +
    '<div style="font-size:11px;word-break:break-all;background:var(--bg);padding:10px;border-radius:8px;margin-bottom:12px;">' + secretBase58 + '</div>' +
    '<button class="btn btn-secondary" id="backup-copy-btn" style="width:100%;">Copy Private Key</button>' +
    '</div>' +
    '<div class="card" style="font-size:12px;color:var(--text-dim);line-height:1.5;">' +
    'This wallet lives in your browser only. It is convenient for getting started, but is meaningfully less secure than a dedicated wallet app like Phantom. Only keep small amounts here — for anything significant, use Connect Phantom instead.' +
    '</div>' +
    '<button class="btn btn-primary btn-block" id="backup-done-btn" style="margin-top:16px;">Saved it, continue</button>' +
    '</div>';
}

function bs58Encode(bytes) {
  const ALPHABET = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
  let digits = [0];
  for (let i = 0; i < bytes.length; i++) {
    let carry = bytes[i];
    for (let j = 0; j < digits.length; j++) {
      carry += digits[j] << 8;
      digits[j] = carry % 58;
      carry = (carry / 58) | 0;
    }
    while (carry > 0) { digits.push(carry % 58); carry = (carry / 58) | 0; }
  }
  let result = "";
  for (let k = 0; bytes[k] === 0 && k < bytes.length - 1; k++) result += "1";
  for (let q = digits.length - 1; q >= 0; q--) result += ALPHABET[digits[q]];
  return result;
}

function wireWalletGate() {
  const createBtn = document.getElementById("gate-create-btn");
  if (createBtn) {
    createBtn.addEventListener("click", () => {
      const kp = createLocalWallet();
      document.getElementById("app").innerHTML = renderWalletBackup(kp);
      document.getElementById("backup-copy-btn").addEventListener("click", () => {
        navigator.clipboard.writeText(bs58Encode(kp.secretKey));
        document.getElementById("backup-copy-btn").textContent = "Copied!";
      });
      document.getElementById("backup-done-btn").addEventListener("click", () => {
        showWalletGate = false;
        render();
      });
    });
  }
  const connectBtn = document.getElementById("gate-connect-btn");
  if (connectBtn) connectBtn.addEventListener("click", connectWallet);
  const skipBtn = document.getElementById("gate-skip-btn");
  if (skipBtn) skipBtn.addEventListener("click", () => { showWalletGate = false; render(); });
}

async function render() {
  const app = document.getElementById("app");

  if (showWalletGate && !wallet) {
    app.innerHTML = renderWalletGate();
    wireWalletGate();
    return;
  }

  let pageHtml = "";
  if (currentPage === "home") pageHtml = await renderHome();
  else if (currentPage === "launch") pageHtml = renderLaunch();
  else if (currentPage === "detail") pageHtml = renderDetail();
  else if (currentPage === "wallet") pageHtml = renderWallet();
  else if (currentPage === "profile") pageHtml = renderProfile();
  else if (currentPage === "feed") pageHtml = renderFeed();

  app.innerHTML = renderHeader() + '<div class="content" style="padding-bottom:90px;">' + pageHtml + '</div>' + renderBottomTabs();
  renderMenu();

  document.getElementById("menu-btn")?.addEventListener("click", () => {
    menuOpen = true;
    document.getElementById("menu-overlay").classList.add("open");
    document.getElementById("menu-panel").classList.add("open");
  });
  document.getElementById("menu-close")?.addEventListener("click", closeMenu);
  document.getElementById("menu-overlay").addEventListener("click", closeMenu);
  document.getElementById("feed-nav-btn").addEventListener("click", () => { currentPage = "feed"; render(); });

  document.querySelectorAll(".menu-item").forEach((btn) => {
    btn.addEventListener("click", () => { currentPage = btn.dataset.page; closeMenu(); render(); });
  });

  document.querySelectorAll(".nav-item").forEach((btn) => {
    btn.addEventListener("click", () => { viewingWallet = null; currentPage = btn.dataset.page; render(); });
  });

  const backBtn = document.getElementById("back-btn");
  if (backBtn) backBtn.addEventListener("click", () => { currentPage = "home"; render(); });

  const walletConnectBtn = document.getElementById("wallet-connect-btn");
  if (walletConnectBtn) walletConnectBtn.addEventListener("click", connectWallet);

  const profileConnectBtn = document.getElementById("profile-connect-btn");
  if (profileConnectBtn) profileConnectBtn.addEventListener("click", connectWallet);
  if (currentPage === "profile" && wallet) loadProfileData();
  if (feedRefreshTimer) { clearInterval(feedRefreshTimer); feedRefreshTimer = null; }
  if (currentPage === "feed") {
    loadFeedData();
    feedRefreshTimer = setInterval(loadFeedData, 60000);
  }

  document.querySelectorAll(".token-row").forEach((el) => {
    el.addEventListener("click", async () => {
      const launches = await fetchLaunches();
      activeToken = launches.find((l) => l.mint === el.dataset.mint);
      tradeMode = "buy";
      currentPage = "detail";
      render();
    });
  });

  document.querySelectorAll(".trench-card").forEach((el) => {
    el.addEventListener("click", async (e) => {
      if (e.target.closest(".trench-icon-btn") || e.target.closest(".trench-buy-btn")) return;
      const launches = await fetchLaunches();
      activeToken = launches.find((l) => l.mint === el.dataset.mint);
      tradeMode = "buy";
      currentPage = "detail";
      render();
    });
  });

  try {
    const savedFavorites = JSON.parse(localStorage.getItem("deepfun_favorites") || "[]");
    document.querySelectorAll(".star-btn").forEach((btn) => {
      if (savedFavorites.includes(btn.getAttribute("data-mint"))) btn.classList.add("starred");
    });
  } catch (err) {}

  document.querySelectorAll(".star-btn").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const mint = btn.getAttribute("data-mint");
      let favorites = [];
      try { favorites = JSON.parse(localStorage.getItem("deepfun_favorites") || "[]"); } catch (err) {}
      if (favorites.includes(mint)) {
        favorites = favorites.filter((m) => m !== mint);
        btn.classList.remove("starred");
      } else {
        favorites.push(mint);
        btn.classList.add("starred");
      }
      localStorage.setItem("deepfun_favorites", JSON.stringify(favorites));
    });
  });

  document.querySelectorAll(".trench-buy-btn").forEach((btn) => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const mint = btn.getAttribute("data-mint");
      const launches = await fetchLaunches();
      activeToken = launches.find((l) => l.mint === mint);
      tradeMode = "buy";
      currentPage = "detail";
      render();
    });
  });

  document.querySelectorAll(".tab-btn").forEach((btn) => {
    btn.addEventListener("click", () => { tradeMode = btn.dataset.mode; render(); });
  });

  const imageInput = document.getElementById("image-input");
  if (imageInput) {
    imageInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      uploadedImageFile = file;
      const reader = new FileReader();
      reader.onload = (ev) => { uploadedImageDataUrl = ev.target.result; render(); };
      reader.readAsDataURL(file);
    });
  }

  const launchBtn = document.getElementById("launch-submit-btn");
  if (launchBtn) launchBtn.addEventListener("click", submitLaunch);

  const tradeBtn = document.getElementById("trade-submit-btn");
  if (tradeBtn) tradeBtn.addEventListener("click", executeTrade);

  if (currentPage === "wallet" && wallet) loadWalletData();
  if (currentPage === "home") startCarousel();
  startAutoRefresh();
  if (currentPage === "detail") { loadTokenStats(); loadRecentTrades(); }

  const copyCaBtn = document.getElementById("copy-ca-btn");
  if (copyCaBtn) {
    copyCaBtn.addEventListener("click", () => {
      navigator.clipboard.writeText(activeToken.mint).then(() => {
        copyCaBtn.textContent = "Copied!";
        setTimeout(() => { copyCaBtn.textContent = "Copy CA"; }, 1500);
      });
    });
  }
  if (currentPage === "home") loadHomeStats();

  const callBtn = document.getElementById("call-token-btn");
  if (callBtn) {
    callBtn.addEventListener("click", async () => {
      if (currentTokenMc === null) { callBtn.textContent = "Still loading price..."; return; }
      callBtn.disabled = true;
      callBtn.textContent = "Calling...";
      const captionInput = document.getElementById("call-caption-input");
      const caption = captionInput ? captionInput.value.trim() : "";
      const { error } = await supabase.from("calls").insert({
        mint: activeToken.mint,
        caller: wallet,
        mc_at_call: currentTokenMc,
        network: NETWORK,
        caption: caption || null,
      });
      if (error) {
        console.error("Call failed:", error);
        callBtn.textContent = "Call failed — retry";
        callBtn.disabled = false;
      } else {
        callBtn.textContent = "✓ Called at $" + currentTokenMc.toLocaleString(undefined, {maximumFractionDigits:0});
      }
    });
  }

  document.querySelectorAll(".filter-pill").forEach((el) => {
    el.addEventListener("click", () => { homeFilter = el.dataset.filter; render(); });
  });
}

function closeMenu() {
  menuOpen = false;
  document.getElementById("menu-overlay").classList.remove("open");
  document.getElementById("menu-panel").classList.remove("open");
}

if (restoreLocalWallet()) showWalletGate = false;
render();
</script>
</body>
</html>
